<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin - Energy & Monitoring Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-6">

    <div class="max-w-7xl mx-auto space-y-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-wide text-white">Digital Twin Enterprise</h1>
                <p class="text-sm text-slate-400">Piattaforma di Monitoraggio Energetico e Controllo Impianti</p>
            </div>
            <div id="connection-status" class="px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                Connessione in corso...
            </div>
        </header>

        <section>
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Stato Impianti e Sensori</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="devices-grid">
                </div>
        </section>

        <section class="bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-lg">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-lg font-semibold text-white">Trend Potenza & Consumi</h2>
                    <p class="text-xs text-slate-400">Analisi in tempo reale delle prestazioni energetiche</p>
                </div>
            </div>
            <div class="h-72 w-full">
                <canvas id="energyChart"></canvas>
            </div>
        </section>

        <section>
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Registro Eventi e Tracciabilità</h2>
            <div class="bg-slate-950 border border-slate-800 rounded-lg p-4 h-48 overflow-y-auto font-mono text-xs text-slate-300 space-y-2 shadow-inner" id="logs-container">
                <div class="text-slate-500">In attesa di eventi dal sistema...</div>
            </div>
        </section>
    </div>

    <script>
        const SUPABASE_URL = "https://kxcuinswyrrzpmlknejs.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4Y3VpbnN3eXJyenBtbGtuZWpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MzI0NzgsImV4cCI6MjEwNDIwODQ3OH0._S5k8CEviqpUAFlFwD4bxhkcPdCozUhz4AWLamFutqw";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const statusBadge = document.getElementById('connection-status');
        const devicesGrid = document.getElementById('devices-grid');
        const logsContainer = document.getElementById('logs-container');

        // Configurazione del Grafico con Chart.js
        const ctx = document.getElementById('energyChart').getContext('2d');
        const energyChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Potenza Attiva (kW)',
                    data: [],
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#94a3b8' } } },
                scales: {
                    x: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } },
                    y: { ticks: { color: '#64748b' }, grid: { color: '#1e293b' } }
                }
            }
        });

        async function initDashboard() {
            const { data, error } = await supabaseClient.from('devices').select('*');

            if (error) {
                statusBadge.textContent = "Errore di connessione";
                statusBadge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-red-500/10 text-red-400 border border-red-500/20";
                return;
            }

            statusBadge.textContent = "Sistema Enterprise Online (Live)";
            statusBadge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";

            renderDevices(data);
            loadInitialTelemetry();
            fetchLatestLogs();
            setupRealtime();
        }

        function renderDevices(devices) {
            if (!devices || devices.length === 0) {
                devicesGrid.innerHTML = `<div class="text-slate-500 col-span-full">Nessun impianto configurato.</div>`;
                return;
            }

            devicesGrid.innerHTML = devices.map(dev => `
                <div class="bg-slate-950 border border-slate-800 rounded-xl p-5 shadow-lg">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-bold text-base text-white">${dev.name}</h3>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${dev.status === 'online' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-400'}">
                            ${dev.status}
                        </span>
                    </div>
                    <p class="text-xs text-slate-400 mb-4">Cliente: <span class="text-slate-200">${dev.client_name}</span></p>
                    <div class="bg-slate-900 rounded-lg p-3 border border-slate-800/60 space-y-2">
                        <div class="flex justify-between text-sm">
                            <span class="text-slate-400">Ultimo Valore:</span>
                            <span class="font-mono text-cyan-400 font-semibold telemetry-val" data-device="${dev.id}">In attesa...</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function loadInitialTelemetry() {
            const { data } = await supabaseClient
                .from('device_telemetry')
                .select('*')
                .order('recorded_at', { ascending: true })
                .limit(20);

            if (data && data.length > 0) {
                data.forEach(item => {
                    if (item.metric_name === 'power_kw') {
                        const timeLabel = new Date(item.recorded_at).toLocaleTimeString();
                        if (energyChart.data.labels.length > 15) {
                            energyChart.data.labels.shift();
                            energyChart.data.datasets[0].data.shift();
                        }
                        energyChart.data.labels.push(timeLabel);
                        energyChart.data.datasets[0].data.push(item.metric_value);
                    }
                    
                    const el = document.querySelector(`.telemetry-val[data-device="${item.device_id}"]`);
                    if (el) {
                        el.textContent = `${item.metric_value} ${item.metric_name === 'power_kw' ? 'kW' : '°C'}`;
                    }
                });
                energyChart.update();
            }
        }

        async function fetchLatestLogs() {
            const { data } = await supabaseClient
                .from('system_logs')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(5);

            if (data && data.length > 0) {
                logsContainer.innerHTML = data.map(log => `
                    <div class="border-b border-slate-900 pb-1">
                        <span class="text-slate-500">[${new Date(log.created_at).toLocaleTimeString()}]</span> 
                        <span class="text-cyan-400 font-semibold">${log.action_type}:</span> 
                        <span class="text-slate-300">${log.description}</span>
                    </div>
                `).join('');
            }
        }

        function setupRealtime() {
            supabaseClient
                .channel('enterprise-digital-twin')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'device_telemetry' }, payload => {
                    const item = payload.new;
                    const el = document.querySelector(`.telemetry-val[data-device="${item.device_id}"]`);
                    if (el) {
                        el.textContent = `${item.metric_value} ${item.metric_name === 'power_kw' ? 'kW' : '°C'}`;
                    }

                    if (item.metric_name === 'power_kw') {
                        const timeLabel = new Date(item.recorded_at).toLocaleTimeString();
                        if (energyChart.data.labels.length > 15) {
                            energyChart.data.labels.shift();
                            energyChart.data.datasets[0].data.shift();
                        }
                        energyChart.data.labels.push(timeLabel);
                        energyChart.data.datasets[0].data.push(item.metric_value);
                        energyChart.update();
                    }
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'system_logs' }, payload => {
                    const log = payload.new;
                    const logHtml = `
                        <div class="border-b border-slate-900 pb-1">
                            <span class="text-slate-500">[${new Date(log.created_at).toLocaleTimeString()}]</span> 
                            <span class="text-cyan-400 font-semibold">${log.action_type}:</span> 
                            <span class="text-slate-300">${log.description}</span>
                        </div>
                    `;
                    logsContainer.insertAdjacentHTML('afterbegin', logHtml);
                })
                .subscribe();
        }

        initDashboard();
    </script>
</body>
</html>
